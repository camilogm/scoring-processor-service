[project]
name = "clip-scoring-service"
version = "0.1.0"
description = "Scores short-form clips: post, improve or skip, with evidence and fixes per dimension."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "faster-whisper>=1.0.3",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.10",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# Paths relative to the repo root, so the report still matches files when the
# SonarQube scanner reads it from inside a container with a different mount.
relative_files = true
